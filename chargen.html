<body>
	<div class="overlay-noise"></div>

	<div class="cancer__wrp-leaderboard cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__wrp-leaderboard-inner"><!--5ETOOLS_AD_LEADERBOARD--></div></div>

	<header class="hidden-xs hidden-sm page__header">
		<div class="container ve-flex-v-baseline">
			<h1 class="page__title no-wrap my-0" id="page__title">Character Creation</h1>
			<p class="page__subtitle no-wrap my-0" id="page__subtitle">Make your selections on the left, view your character sheet on the right</p>
		</div>
	</header>

	<nav class="container page__nav" id="navigation">
		<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
	</nav>

	<main class="container-classes">
		<table>
			<tr>
				<td style="width: 50%; vertical-align:top">
					<table>
						<tr>
							<td colspan="6">Name: <input type="text" id="nameInput" onkeyup="updateName()"/></td>
						</tr>
						<tr>
							<td><button onclick="preview('races')">View Races</button></td>
							<td><button onclick="preview('classes')">View Classes</button></td>
							<td><button onclick="preview('backgrounds')">View Backgrounds</button></td>
							<td><button onclick="preview('feats')">View Feats</button></td>
							<td><button onclick="preview('spells')">View Spells</button></td>
						</tr>
						<tr>
							<td>STR: <input type="number" min="1" max="20" id="strInput" value="8" onchange="updateAbilityScore('str')"/></td>
							<td>DEX: <input type="number" min="1" max="20" id="dexInput" value="8" onchange="updateAbilityScore('dex')"/></td>
							<td>CON: <input type="number" min="1" max="20" id="conInput" value="8" onchange="updateAbilityScore('con')"/></td>
							<td>INT: <input type="number" min="1" max="20" id="intInput" value="8" onchange="updateAbilityScore('int')"/></td>
							<td>WIS: <input type="number" min="1" max="20" id="wisInput" value="8" onchange="updateAbilityScore('wis')"/></td>
							<td>CON: <input type="number" min="1" max="20" id="chaInput" value="8" onchange="updateAbilityScore('cha')"/></td>
						</tr>
					</table>
				</td>
				<td style="width: 50%;vertical-align:top" rowspan="2">
					<table id="content" class="w-100 stats">

					</table>
				</td>
			</tr>
			<tr>
				<td id="contentPreview" style="width:700px;height:700px;overflow-x:scroll;overflow-y:scroll;vertical-align:top">
				</td>
			</tr>
		</table>

	</main>

	<script type="text/javascript" defer src="lib/jquery.js"></script>
	<script type="text/javascript" defer src="lib/ace.js"></script>
	<script type="text/javascript" defer src="js/parser.js"></script>
	<script type="text/javascript" defer src="js/utils.js"></script>
	<script type="text/javascript" defer src="js/utils-ui.js"></script>
	<script type="text/javascript" defer src="js/utils-list.js"></script>
	<script type="text/javascript" defer src="lib/localforage.js"></script>
	<script type="text/javascript" defer src="js/omnidexer.js"></script>
	<script type="module" src="js/omnisearch.js"></script>
	<script type="module" src="js/filter.js"></script>
	<script type="text/javascript" defer src="js/utils-dataloader.js"></script>
	<script type="module" src="js/utils-brew.js"></script>
	<script type="module" src="js/utils-config.js"></script>
	<script type="text/javascript" defer src="js/render.js"></script>
	<script type="text/javascript" defer src="js/render-races.js"></script>
	<script type="text/javascript" defer src="js/render-dice.js"></script>
	<script type="text/javascript" defer src="js/render-markdown.js"></script>
	<script type="text/javascript" defer src="js/render-card.js"></script>
	<script type="text/javascript" defer src="js/scalecreature.js"></script>
	<script type="text/javascript" defer src="js/hist.js"></script>
	<script type="text/javascript" defer src="js/listpage.js"></script>
	<script type="text/javascript" defer src="js/filter-common.js"></script>
	<script type="text/javascript" defer src="js/filter-races.js"></script>
	<script type="text/javascript" defer src="js/races.js"></script>
	<script type="text/javascript" defer src="js/list2.js"></script>
	<script type="text/javascript" defer src="js/chargen.js"></script>
	<script type="text/javascript" defer src="lib/elasticlunr.js"></script>

	<div class="cancer__wrp-sidebar-rhs cancer__wrp-sidebar-rhs--scrolling-page cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__sidebar-rhs-inner cancer__sidebar-rhs-inner--top"><!--5ETOOLS_AD_RIGHT_1--></div><div class="cancer__sidebar-rhs-inner cancer__sidebar-rhs-inner--bottom"><!--5ETOOLS_AD_RIGHT_2--></div></div>
